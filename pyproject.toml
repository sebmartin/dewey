[project]
name = "dewey"
version = "0.1.0"
description = "Hosted MCP service: shared filesystem, auth, and a safety boundary for local MCP extensions."
authors = [
    { name = "Seb Martin", email = "seb.d.martin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "fastmcp>=3.3.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
