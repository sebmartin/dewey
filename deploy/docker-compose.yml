name: dewey

services:
  mcp-proxy:
    # TBXark/mcp-proxy aggregates extension MCP endpoints behind a single URL.
    # NOTE: default listen port assumed 9090 — confirm against the image's docs
    # and update both this file and mcp-proxy.yml if it differs.
    image: ghcr.io/tbxark/mcp-proxy:latest
    ports:
      - "9090:9090"
    volumes:
      - ./mcp-proxy.yml:/config.yml:ro
    depends_on:
      - dewey
      - qmd
    restart: unless-stopped

  dewey:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ${DATA_DIR:?DATA_DIR must be set in .env}:/data
      - ${TMP_DIR:?TMP_DIR must be set in .env}:/tmp
    secrets:
      - dewey_token
    environment:
      DATA_ROOT: /data
      TMP_ROOT: /tmp
    # Port 8001 is intentionally NOT published — commit API is reachable only
    # from inside the Docker network (i.e. only legitimate extension containers).
    expose:
      - "8000"
      - "8001"
    restart: unless-stopped

  qmd:
    # First extension. Embeds @tobilu/qmd as a library and exposes the
    # five qmd_* MCP tools, scoped to dewey collections by a chokidar
    # watcher over /data. /data is bind-mounted read-only — qmd is a
    # transform extension that never writes back through this path.
    build:
      context: ../extensions/qmd
      dockerfile: Dockerfile
    volumes:
      - ${DATA_DIR:?DATA_DIR must be set in .env}:/data:ro
      - qmd_cache:/cache
    environment:
      DATA_ROOT: /data
      QMD_CACHE_DIR: /cache
    expose:
      - "8181"
    restart: unless-stopped

secrets:
  dewey_token:
    file: ../secrets/dewey_token.txt

volumes:
  qmd_cache:
